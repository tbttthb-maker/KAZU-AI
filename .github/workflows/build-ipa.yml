name: Build ZOLNU IPA for Sideloadly
on:
  push:
    branches: ['zolnu/iphone']
    paths: ['zolnu/**', '.github/workflows/build-ipa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: zolnu
    env:
      CI: '1'
      APP_IDENTIFIER: com.zolnu.preview
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: zolnu/package-lock.json
      - name: Install exact dependencies
        run: npm ci
      - name: Validate source
        run: npm run typecheck && npm run lint && npm test
      - name: Build and package arm64 IPA
        run: bash scripts/build-ipa.sh output
      - uses: actions/upload-artifact@v4
        with:
          name: ZOLNU-Sideloadly-IPA
          path: zolnu/output/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ios-build-log
          path: zolnu/output/build.log
          if-no-files-found: ignore
